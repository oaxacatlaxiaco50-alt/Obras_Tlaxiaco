server {
    listen 80;
    server_name localhost;

    # 1. Rutas del Backend (Spring Boot en puerto interno 8081)
    location ~ ^/(auth|obras|users|ai|bitacoras|audit-logs|notificaciones|rutas|configuracion|expedientes|metas|avances|archivos|admin/configuracion|api) {
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
    }

    # 2. Descarga y visualización de archivos y fotografías subidas
    location /uploads/ {
        proxy_pass http://backend:8081/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 50M;
    }

    # 3. Frontend Angular SPA (Archivos estáticos compilados)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Desactivar logs de favicon y robots para no saturar disco
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        log_not_found off;
        access_log off;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
